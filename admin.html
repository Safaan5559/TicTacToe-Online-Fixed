<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe Admin</title><link rel="stylesheet" href="app.css"></head><body><main class="wrap"><div class="card"><h1>Admin</h1><p>Enter the backend admin key. The key is never stored in the repository.</p><input class="input" id="key" type="password" placeholder="ADMIN_KEY"><button class="btn primary" id="load">Load users</button><button class="btn danger" id="reset">Reset platform</button><div id="out" class="list"></div></div></main><script src="config.js"></script><script>
const B=(window.TTT_CONFIG.backendUrl||'').replace(/\/$/,'');const out=document.getElementById('out');const key=()=>document.getElementById('key').value;async function call(p,o={}){const r=await fetch(B+p,{...o,headers:{'Content-Type':'application/json','X-Admin-Key':key()}});return r.json()}document.getElementById('load').onclick=async()=>{if(!B)return out.textContent='Set a backend URL first.';const d=await call('/api/admin/users?userId=admin');out.innerHTML=Array.isArray(d)?d.map(u=>`<div class="item"><span>${u.name} <small>${u.username||''}</small></span><span>${u.wins}W ${u.losses}L ${u.draws}D</span></div>`).join(''):JSON.stringify(d)};document.getElementById('reset').onclick=async()=>{if(confirm('Reset the entire platform?'))out.textContent=JSON.stringify(await call('/api/admin/reset-platform',{method:'POST',body:'{}'}))};
</script></body></html>

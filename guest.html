<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe — Guest</title><style>body{margin:0;background:#0b0f14;color:#fff;font-family:system-ui;text-align:center}.wrap{width:min(92vw,420px);margin:40px auto}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.c{aspect-ratio:1;background:#121b25;border:1px solid #2a3948;border-radius:16px;color:#22d3ee;font-size:4rem;font-weight:900}.b{background:#22d3ee;border:0;border-radius:12px;padding:12px 18px;font-weight:800}.muted{color:#8b98a7}</style></head><body><div class="wrap"><h1>🎮 Guest Mode</h1><p class="muted">Local two-player game — no account or server needed.</p><div id="s">X to move</div><div class="board" id="b"></div><button class="b" onclick="reset()">New Game</button><p><a href="index.html" style="color:#22d3ee">← Main game</a></p></div><script>let a=Array(9).fill(''),t='X',over=0;const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function r(){let w=null;for(const l of lines)if(a[l[0]]&&a[l[0]]===a[l[1]]&&a[l[1]]===a[l[2]])w=a[l[0]];if(!w&&a.every(Boolean))w='Draw';return w}function draw(){b.innerHTML=a.map((v,i)=>`<button class="c" onclick="m(${i})">${v}</button>`).join('');s.textContent=over?over==='Draw'?'Draw!':over+' wins!':t+' to move'}function m(i){if(over||a[i])return;a[i]=t;over=r();if(!over)t=t==='X'?'O':'X';draw()}function reset(){a=Array(9).fill('');t='X';over=0;draw()}draw()</script></body></html>

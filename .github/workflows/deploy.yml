name: Deploy TicTacToe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o *.zip -d extracted || true
          cp extracted/Tictactoe_all_files_renamedn/tictactoe-app/Index.html index.html
          cp extracted/Tictactoe_all_files_renamedn/tictactoe-app/Index.js app.js
          cp extracted/Tictactoe_all_files_renamedn/tictactoe-app/Index.css app.css
          cp extracted/Tictactoe_all_files_renamedn/tictactoe-app/favicon.svg favicon.svg
          cp extracted/Tictactoe_all_files_renamedn/tictactoe-app/admin.html admin.html
          cp extracted/Tictactoe_all_files_renamedn/tictactoe-app/guest.html guest.html

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js app.css favicon.svg admin.html guest.html
          git diff --cached --quiet || git commit -m "Auto-deploy TicTacToe project"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
